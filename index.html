<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bognár Zsolt | CS2 Challenge</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #fff;

    background:
        linear-gradient(
            90deg,
            rgba(5, 10, 18, .94),
            rgba(5, 10, 18, .72),
            rgba(5, 10, 18, .94)
        ),
        url("cs2.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
}

/* -------------------------
   ANIMÁLT FÉNYEK
------------------------- */

body::before {
    content: "";

    position: fixed;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    background: #ff9800;

    filter: blur(180px);

    opacity: .12;

    top: -250px;
    right: -150px;

    animation: orangeGlow 8s infinite alternate;
}

body::after {
    content: "";

    position: fixed;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    background: #008cff;

    filter: blur(180px);

    opacity: .10;

    bottom: -250px;
    left: -150px;

    animation: blueGlow 9s infinite alternate;
}

@keyframes orangeGlow {
    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(-100px,100px);
    }
}

@keyframes blueGlow {
    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(120px,-80px);
    }
}

/* -------------------------
   FŐ HUD
------------------------- */

.hud {
    position: relative;

    width: 94%;
    max-width: 1100px;

    z-index: 5;

    background:
        linear-gradient(
            145deg,
            rgba(8,15,25,.92),
            rgba(12,18,28,.78)
        );

    border:
        1px solid rgba(255,255,255,.12);

    box-shadow:
        0 30px 100px rgba(0,0,0,.75),
        inset 0 0 50px rgba(255,255,255,.025);

    backdrop-filter: blur(14px);

    overflow: hidden;

    animation: appear .8s ease-out;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.96) translateY(20px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* -------------------------
   FELSŐ SÁV
------------------------- */

.topbar {
    height: 62px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 28px;

    background:
        rgba(0,0,0,.35);

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.logo {
    font-weight: 900;

    letter-spacing: 2px;

    font-size: 18px;
}

.logo span {
    color: #f59e0b;
}

.live {
    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 12px;

    letter-spacing: 2px;

    color: #ef4444;

    font-weight: bold;
}

.live-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #ef4444;

    box-shadow:
        0 0 10px #ef4444;

    animation: blink 1s infinite;
}

@keyframes blink {
    50% {
        opacity: .25;
    }
}

/* -------------------------
   CS2 HEADER
------------------------- */

.header {
    padding: 50px 30px 20px;

    text-align: center;
}

.small-title {
    color: #94a3b8;

    font-size: 12px;

    letter-spacing: 4px;

    margin-bottom: 15px;
}

.name {
    font-size:
        clamp(38px, 7vw, 78px);

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: -2px;

    color: #f8fafc;

    text-shadow:
        0 4px 20px rgba(0,0,0,.8);
}

.name span {
    color: #f59e0b;

    text-shadow:
        0 0 25px rgba(245,158,11,.35);
}

.status-line {
    margin-top: 15px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 12px;

    font-family: monospace;

    color: #94a3b8;

    font-size: 14px;
}

.status-line strong {
    color: #ef4444;
}

/* -------------------------
   FŐ SZÁMLÁLÓ
------------------------- */

.timer-panel {
    width: 92%;

    margin: 25px auto;

    padding: 35px 20px;

    background:
        linear-gradient(
            135deg,
            rgba(0,0,0,.48),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.09);

    position: relative;
}

.timer-title {
    text-align: center;

    color: #64748b;

    font-size: 11px;

    letter-spacing: 4px;

    margin-bottom: 25px;
}

.timer {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;
}

.time-box {
    text-align: center;

    position: relative;

    padding: 20px 5px;
}

.time-box:not(:last-child)::after {
    content: ":";

    position: absolute;

    right: -8px;

    top: 27px;

    color: #475569;

    font-size: 34px;
}

.number {
    font-family:
        "Courier New",
        monospace;

    font-size:
        clamp(40px, 7vw, 75px);

    font-weight: bold;

    color: #f8fafc;

    text-shadow:
        0 0 15px rgba(255,255,255,.18);
}

.label {
    margin-top: 8px;

    color: #64748b;

    font-size: 10px;

    letter-spacing: 3px;

    font-weight: bold;
}

/* -------------------------
   STATOK
------------------------- */

.stats {
    width: 92%;

    margin: 25px auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}

.stat {
    padding: 18px;

    background:
        rgba(0,0,0,.32);

    border:
        1px solid rgba(255,255,255,.08);

    text-align: center;

    transition: .25s;
}

.stat:hover {
    transform: translateY(-4px);

    border-color:
        rgba(245,158,11,.4);
}

.stat-icon {
    font-size: 22px;

    margin-bottom: 8px;
}

.stat-title {
    color: #64748b;

    font-size: 10px;

    letter-spacing: 2px;

    font-weight: bold;
}

.stat-value {
    margin-top: 6px;

    font-family: monospace;

    font-size: 22px;

    font-weight: bold;
}

.orange {
    color: #f59e0b;
}

.red {
    color: #ef4444;
}

.blue {
    color: #38bdf8;
}

/* -------------------------
   STATUS
------------------------- */

.alive {
    width: 92%;

    margin: 25px auto;

    padding: 14px 20px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 10px;

    background:
        rgba(34,197,94,.06);

    border:
        1px solid rgba(34,197,94,.18);

    color: #86efac;

    font-family: monospace;

    font-size: 13px;

    letter-spacing: 2px;
}

.alive-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #22c55e;

    box-shadow:
        0 0 12px #22c55e;

    animation: blink 1.5s infinite;
}

/* -------------------------
   ALSÓ INFORMÁCIÓ
------------------------- */

.bottom {
    padding: 20px 30px 30px;

    text-align: center;

    color: #475569;

    font-size: 11px;

    line-height: 1.8;
}

.bottom strong {
    color: #94a3b8;
}

/* -------------------------
   MOBIL
------------------------- */

@media (max-width: 700px) {

    body {
        padding: 15px 0;

        background-attachment: scroll;
    }

    .hud {
        width: 96%;
    }

    .topbar {
        padding: 0 16px;
    }

    .logo {
        font-size: 14px;
    }

    .header {
        padding-top: 35px;
    }

    .timer {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .time-box:nth-child(2)::after {
        display: none;
    }

    .time-box:nth-child(4)::after {
        display: none;
    }

    .stats {
        grid-template-columns:
            1fr;
    }

    .timer-panel,
    .stats,
    .alive {
        width: 94%;
    }
}

</style>
</head>

<body>

<div class="hud">

    <!-- FELSŐ SÁV -->

    <div class="topbar">

        <div class="logo">
            COUNTER<span>•</span>STRIKE
        </div>

        <div class="live">

            <div class="live-dot"></div>

            LIVE

        </div>

    </div>


    <!-- FEJLÉC -->

    <div class="header">

        <div class="small-title">
            PERSONAL CHALLENGE
        </div>

        <div class="name">
            Bognár <span>Zsolt</span>
        </div>

        <div class="status-line">

            STATUS:

            <strong>
                PC DISCONNECTED
            </strong>

        </div>

    </div>


    <!-- IDŐ -->

    <div class="timer-panel">

        <div class="timer-title">
            SURVIVAL TIME
        </div>

        <div class="timer">

            <div class="time-box">

                <div
                    class="number"
                    id="days"
                >
                    0
                </div>

                <div class="label">
                    DAYS
                </div>

            </div>


            <div class="time-box">

                <div
                    class="number"
                    id="hours"
                >
                    00
                </div>

                <div class="label">
                    HOURS
                </div>

            </div>


            <div class="time-box">

                <div
                    class="number"
                    id="minutes"
                >
                    00
                </div>

                <div class="label">
                    MINUTES
                </div>

            </div>


            <div class="time-box">

                <div
                    class="number"
                    id="seconds"
                >
                    00
                </div>

                <div class="label">
                    SECONDS
                </div>

            </div>

        </div>

    </div>


    <!-- STATOK -->

    <div class="stats">

        <div class="stat">

            <div class="stat-icon">
                🔫
            </div>

            <div class="stat-title">
                KILLS
            </div>

            <div class="stat-value orange">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                💀
            </div>

            <div class="stat-title">
                DEATHS
            </div>

            <div class="stat-value red">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                🏆
            </div>

            <div class="stat-title">
                STREAK
            </div>

            <div
                class="stat-value blue"
                id="streak"
            >
                0 DAYS
            </div>

        </div>

    </div>


    <!-- ALIVE -->

    <div class="alive">

        <div class="alive-dot"></div>

        STATUS: ALIVE

    </div>


    <!-- ALSÓ RÉSZ -->

    <div class="bottom">

        CHALLENGE STARTED:

        <strong>
            10 AUG 2026 • 16:00
        </strong>

        <br>

        PC nélkül • A számláló folyamatosan fut

    </div>

</div>


<script>

/*
==========================================
BOGNÁR ZSOLT CS2 CHALLENGE
==========================================

Kezdés:
2026. augusztus 10. 16:00

==========================================
*/

const KEZDÉS_DÁTUMA =
    new Date("2026-08-10T16:00:00");


function frissit() {

    const most =
        new Date();


    let kulonbseg =
        most - KEZDÉS_DÁTUMA;


    if (kulonbseg < 0) {

        kulonbseg = 0;

    }


    const osszesMasodperc =
        Math.floor(
            kulonbseg / 1000
        );


    /* NAP */

    const napok =
        Math.floor(
            osszesMasodperc / 86400
        );


    /* ÓRA */

    const orak =
        Math.floor(
            (osszesMasodperc % 86400)
            / 3600
        );


    /* PERC */

    const percek =
        Math.floor(
            (osszesMasodperc % 3600)
            / 60
        );


    /* MÁSODPERC */

    const masodpercek =
        osszesMasodperc % 60;


    /* KIÍRÁS */

    document
        .getElementById("days")
        .textContent =
        napok;


    document
        .getElementById("hours")
        .textContent =
        String(orak)
        .padStart(2, "0");


    document
        .getElementById("minutes")
        .textContent =
        String(percek)
        .padStart(2, "0");


    document
        .getElementById("seconds")
        .textContent =
        String(masodpercek)
        .padStart(2, "0");


    /* STREAK */

    document
        .getElementById("streak")
        .textContent =
        napok + " DAYS";

}


/* Indítás */

frissit();


/* Frissítés másodpercenként */

setInterval(
    frissit,
    1000
);

</script>

</body>
</html>
