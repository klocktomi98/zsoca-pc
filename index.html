<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bognár Zsolt | Számítógép nélkül</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(2, 6, 23, 0.72),
                    rgba(2, 6, 23, 0.88)
                ),
                url("cs2.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            overflow: hidden;
        }

        /* -----------------------------
           HÁTTÉR ANIMÁCIÓ
        ----------------------------- */

        .background-glow {
            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: #06b6d4;

            filter: blur(140px);

            opacity: 0.15;

            top: -200px;
            left: -200px;

            animation: glowMove 10s infinite alternate ease-in-out;

            pointer-events: none;
        }

        .background-glow.two {
            background: #f97316;

            top: auto;
            left: auto;

            right: -200px;
            bottom: -200px;

            animation-delay: 3s;
        }

        @keyframes glowMove {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(180px, 120px);
            }
        }

        /* -----------------------------
           FŐ KÁRTYA
        ----------------------------- */

        .container {
            position: relative;
            z-index: 5;

            width: 92%;
            max-width: 1100px;

            padding: 55px 45px;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(15, 23, 42, 0.78),
                    rgba(2, 6, 23, 0.68)
                );

            border: 1px solid rgba(255, 255, 255, 0.16);

            border-radius: 30px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.65),
                inset 0 0 50px rgba(255, 255, 255, 0.025);

            animation: cardAppear 1s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* -----------------------------
           CS2 BADGE
        ----------------------------- */

        .badge {
            display: inline-block;

            padding: 9px 20px;

            margin-bottom: 22px;

            border-radius: 50px;

            color: #67e8f9;

            background: rgba(6, 182, 212, 0.10);

            border: 1px solid rgba(34, 211, 238, 0.35);

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;

            box-shadow:
                0 0 20px rgba(34, 211, 238, 0.08);
        }

        /* -----------------------------
           CÍM
        ----------------------------- */

        h1 {
            margin: 0;

            font-size:
                clamp(30px, 5vw, 62px);

            line-height: 1.1;

            font-weight: 800;
        }

        .name {
            color: #22d3ee;

            text-shadow:
                0 0 10px rgba(34, 211, 238, 0.8),
                0 0 30px rgba(34, 211, 238, 0.45),
                0 0 60px rgba(34, 211, 238, 0.2);
        }

        .title-text {
            color: #f8fafc;
        }

        .subtitle {
            margin-top: 20px;

            color: #94a3b8;

            font-size: 18px;
        }

        /* -----------------------------
           SZÁMLÁLÓ
        ----------------------------- */

        .timer {
            margin-top: 45px;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
        }

        .box {
            position: relative;

            padding: 28px 10px;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.09),
                    rgba(255, 255, 255, 0.025)
                );

            border: 1px solid rgba(255, 255, 255, 0.11);

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.35);

            overflow: hidden;

            transition:
                transform 0.3s,
                border-color 0.3s,
                box-shadow 0.3s;
        }

        .box::before {
            content: "";

            position: absolute;

            width: 100%;
            height: 2px;

            top: 0;
            left: -100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #22d3ee,
                    transparent
                );

            animation: scan 4s infinite;
        }

        @keyframes scan {
            0% {
                left: -100%;
            }

            50% {
                left: 100%;
            }

            100% {
                left: 100%;
            }
        }

        .box:hover {
            transform: translateY(-8px);

            border-color:
                rgba(34, 211, 238, 0.55);

            box-shadow:
                0 0 35px
                rgba(34, 211, 238, 0.16);
        }

        .number {
            font-family:
                "Courier New",
                monospace;

            font-size:
                clamp(42px, 7vw, 82px);

            line-height: 1;

            font-weight: bold;

            color: #f8fafc;

            text-shadow:
                0 0 10px rgba(34, 211, 238, 0.8),
                0 0 25px rgba(34, 211, 238, 0.35);
        }

        .label {
            margin-top: 13px;

            color: #67e8f9;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 3px;
        }

        /* -----------------------------
           KEZDÉSI IDŐ
        ----------------------------- */

        .start {
            margin-top: 35px;

            color: #64748b;

            font-size: 14px;
        }

        .start strong {
            color: #cbd5e1;

            font-weight: 600;
        }

        /* -----------------------------
           STREAK
        ----------------------------- */

        .streak {
            margin: 25px auto 0;

            max-width: 500px;

            padding: 12px 20px;

            border-radius: 12px;

            color: #fbbf24;

            background:
                rgba(251, 191, 36, 0.07);

            border:
                1px solid rgba(251, 191, 36, 0.18);

            font-size: 14px;

            box-shadow:
                0 0 25px
                rgba(251, 191, 36, 0.04);
        }

        /* -----------------------------
           FOOTER
        ----------------------------- */

        .footer {
            margin-top: 25px;

            color: #475569;

            font-size: 12px;

            letter-spacing: 1px;
        }

        /* -----------------------------
           MOBIL
        ----------------------------- */

        @media (max-width: 700px) {

            body {
                padding: 20px 0;

                overflow: auto;

                background-attachment: scroll;
            }

            .container {
                padding: 40px 18px;

                border-radius: 22px;
            }

            .timer {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;

                margin-top: 35px;
            }

            .box {
                padding: 23px 5px;
            }

            .subtitle {
                font-size: 15px;
            }

            .start {
                line-height: 1.6;
            }
        }
    </style>
</head>

<body>

    <!-- Háttér fények -->

    <div class="background-glow"></div>
    <div class="background-glow two"></div>


    <!-- FŐ OLDAL -->

    <main class="container">

        <div class="badge">
            🎮 CS2 CHALLENGE
        </div>


        <h1>

            <span class="name">
                Bognár Zsolt
            </span>

            <br>

            <span class="title-text">
                ennyi ideje bírja
                <br>
                számítógép nélkül
            </span>

        </h1>


        <div class="subtitle">
            Vajon meddig tart még a kihívás? 😈
        </div>


        <!-- SZÁMLÁLÓ -->

        <section class="timer">

            <div class="box">

                <div
                    class="number"
                    id="days"
                >
                    0
                </div>

                <div class="label">
                    NAP
                </div>

            </div>


            <div class="box">

                <div
                    class="number"
                    id="hours"
                >
                    00
                </div>

                <div class="label">
                    ÓRA
                </div>

            </div>


            <div class="box">

                <div
                    class="number"
                    id="minutes"
                >
                    00
                </div>

                <div class="label">
                    PERC
                </div>

            </div>


            <div class="box">

                <div
                    class="number"
                    id="seconds"
                >
                    00
                </div>

                <div class="label">
                    MÁSODPERC
                </div>

            </div>

        </section>


        <!-- KEZDÉS -->

        <div class="start">

            🕐 A kihívás kezdete:

            <strong>
                2026. augusztus 10. 16:00
            </strong>

        </div>


        <!-- STREAK -->

        <div class="streak">

            🔥 A kihívás folyamatosan tart!

        </div>


        <div class="footer">

            ⏱️ LIVE TIMER • FRISSÍTÉS MÁSODPERCENKÉNT

        </div>

    </main>


    <script>

        /*
        ========================================
        BOGNÁR ZSOLT KIHÍVÁS
        KEZDÉS: 2026.08.10 16:00
        ========================================
        */

        const KEZDÉS_DÁTUMA =
            new Date("2026-08-10T16:00:00");


        function frissit() {

            const most =
                new Date();


            let kulonbseg =
                most - KEZDÉS_DÁTUMA;


            /*
            Ha valamiért a gép órája
            szerint még nem kezdődött el,
            akkor 0-ról indul.
            */

            if (kulonbseg < 0) {

                kulonbseg = 0;

            }


            const osszesMasodperc =
                Math.floor(
                    kulonbseg / 1000
                );


            /*
            NAP
            */

            const napok =
                Math.floor(
                    osszesMasodperc / 86400
                );


            /*
            ÓRA
            */

            const orak =
                Math.floor(
                    (osszesMasodperc % 86400)
                    / 3600
                );


            /*
            PERC
            */

            const percek =
                Math.floor(
                    (osszesMasodperc % 3600)
                    / 60
                );


            /*
            MÁSODPERC
            */

            const masodpercek =
                osszesMasodperc % 60;


            /*
            HTML FRISSÍTÉSE
            */

            document
                .getElementById("days")
                .textContent =
                napok;


            document
                .getElementById("hours")
                .textContent =
                String(orak)
                    .padStart(2, "0");


            document
                .getElementById("minutes")
                .textContent =
                String(percek)
                    .padStart(2, "0");


            document
                .getElementById("seconds")
                .textContent =
                String(masodpercek)
                    .padStart(2, "0");

        }


        /*
        Azonnali indítás
        */

        frissit();


        /*
        Frissítés minden másodpercben
        */

        setInterval(
            frissit,
            1000
        );

    </script>

</body>
</html>
