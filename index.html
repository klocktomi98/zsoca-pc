<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bognár Zsolt - Számítógép nélkül</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            padding: 50px 25px;
        }

        h1 {
            font-size: clamp(28px, 5vw, 52px);
            margin-bottom: 40px;
        }

        .name {
            color: #38bdf8;
        }

        .timer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .box {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 25px 10px;
            backdrop-filter: blur(10px);
        }

        .number {
            font-size: clamp(32px, 6vw, 65px);
            font-weight: bold;
            color: #38bdf8;
        }

        .label {
            margin-top: 8px;
            font-size: 16px;
            color: #cbd5e1;
        }

        .subtitle {
            margin-top: 35px;
            color: #94a3b8;
        }

        @media (max-width: 600px) {
            .timer {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>
        <span class="name">Bognár Zsolt</span>
        ennyi napja bírja számítógép nélkül
    </h1>

    <div class="timer">

        <div class="box">
            <div class="number" id="days">0</div>
            <div class="label">NAP</div>
        </div>

        <div class="box">
            <div class="number" id="hours">00</div>
            <div class="label">ÓRA</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">00</div>
            <div class="label">PERC</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">00</div>
            <div class="label">MÁSODPERC</div>
        </div>

    </div>

    <div class="subtitle">
        ⏱️ A számláló folyamatosan frissül
    </div>

</div>

<script>

const KEZDÉS_DÁTUMA = new Date("2026-08-10T16:00:00");

function frissit() {

    const most = new Date();
    let kulonbseg = most - KEZDÉS_DÁTUMA;

    if (kulonbseg < 0) {
        kulonbseg = 0;
    }

    const masodperc = Math.floor(kulonbseg / 1000);

    const napok = Math.floor(masodperc / 86400);
    const orak = Math.floor((masodperc % 86400) / 3600);
    const percek = Math.floor((masodperc % 3600) / 60);
    const masodpercek = masodperc % 60;

    document.getElementById("days").textContent = napok;
    document.getElementById("hours").textContent =
        String(orak).padStart(2, "0");
    document.getElementById("minutes").textContent =
        String(percek).padStart(2, "0");
    document.getElementById("seconds").textContent =
        String(masodpercek).padStart(2, "0");
}

frissit();
setInterval(frissit, 1000);

</script>

</body>
</html>
